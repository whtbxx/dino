<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dino Dash Bubbles – Maths Race</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <script type="importmap">
    { "imports": { "@material/web/": "https://esm.run/@material/web/" } }
  </script>
  <script type="module">
    // One bundle: importing individual component files from esm.run bundles shared
    // internals (e.g. md-focus-ring) more than once and throws a duplicate-define error.
    import '@material/web/all.js';
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" id="app">
    <header class="top-bar">
      <h1>🦖 Dino Dash</h1>
      <div class="scores" aria-label="Scoreboard">
        <span class="score correct" aria-label="Correct answers">✅ <b id="correctCount">0</b></span>
        <span class="score incorrect" aria-label="Oops answers">❌ <b id="incorrectCount">0</b></span>
      </div>
    </header>

    <section class="track-card" aria-labelledby="race-heading">
      <h2 id="race-heading" class="visually-hidden">Race track</h2>
      <div class="track" id="track" role="img" aria-label="Race starting">
        <div class="sky" aria-hidden="true"><span class="cloud c1">☁️</span><span class="cloud c2">☁️</span><span class="sun">🌞</span></div>
        <div class="finish" aria-hidden="true"><span class="flag">🏁</span></div>
        <div class="runner player" id="player" aria-hidden="true"><span class="sprite">🏃</span><span class="tag">You</span></div>
        <div class="runner dino" id="dino" aria-hidden="true"><span class="sprite">🦖</span><span class="tag">Dino</span></div>
        <div class="ground" aria-hidden="true"></div>
      </div>
      <div class="gap-readout" id="gapReadout">Dino is 4 steps behind</div>
    </section>

    <section class="quiz" aria-labelledby="question">
      <div class="q-row">
        <h2 id="question" class="question">? + ?</h2>
        <div class="streak" id="streak"><span class="flames" id="flames" aria-hidden="true"></span><span id="streakText"></span></div>
      </div>
      <p id="feedback" class="feedback" role="status" aria-live="polite">Pop the right bubble!</p>
      <div class="choices" id="choices" role="group" aria-label="Answer choices"></div>
    </section>
  </main>

  <dialog id="endDialog" aria-labelledby="endTitle" aria-describedby="endText">
    <div class="end-emoji" id="endEmoji" aria-hidden="true">🏆</div>
    <h2 id="endTitle">You won!</h2>
    <p id="endText"></p>
    <md-filled-button id="restartBtn"><md-icon slot="icon">replay</md-icon>Race again</md-filled-button>
  </dialog>

  <script src="script.js" defer></script>
</body>
</html>
