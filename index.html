<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dino Dash 🦕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "@material/web/": "https://esm.run/@material/web/"
        }
      }
    </script>
  </head>
  <body class="md-typescale-body-large">
    <header class="top-app-bar">
      <h1 class="md-typescale-title-large">Dino Dash 🦕</h1>
    </header>
    <main>
      <section class="card">
        <h2 class="md-typescale-headline-small">Add these two numbers</h2>
        <ul class="scoreboard" aria-label="Session score">
          <li>
            <span class="score-label md-typescale-label-medium">Correct</span>
            <span class="score-value md-typescale-headline-small" id="correct-count">0</span>
          </li>
          <li>
            <span class="score-label md-typescale-label-medium">Incorrect</span>
            <span class="score-value md-typescale-headline-small" id="incorrect-count">0</span>
          </li>
        </ul>
        <p class="question md-typescale-display-small" id="question" aria-live="polite">
          <span id="first-number">?</span>
          <span class="operator" aria-hidden="true">+</span>
          <span id="second-number">?</span>
        </p>
        <form id="sum-form">
          <md-outlined-text-field
            id="answer"
            name="answer"
            label="Your answer"
            type="number"
            inputmode="numeric"
            required
            autocomplete="off"
          >
            <md-icon slot="leading-icon">calculate</md-icon>
          </md-outlined-text-field>
          <p class="feedback md-typescale-body-medium" id="feedback" role="status" aria-live="polite"></p>
          <div class="actions">
            <md-outlined-button type="button" id="next-question" hidden>
              Next question
            </md-outlined-button>
            <md-filled-button type="submit" id="check-button" disabled>
              Check
            </md-filled-button>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
