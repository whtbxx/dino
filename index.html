<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dino Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-app-bar">
      <h1>Dino Games</h1>
    </header>
    <main>
      <p class="intro">Pick a game to play.</p>
      <div class="game-grid">
        <a class="game-card" href="dash/">
          <span class="game-emoji" aria-hidden="true">🏃‍♂️🦖</span>
          <h2>Dino Dash</h2>
          <p>Race the dino by answering maths questions. Correct answers pull you ahead; wrong ones let the dino catch up.</p>
        </a>
        <a class="game-card" href="battles-x/">
          <span class="game-emoji" aria-hidden="true">🥚⚔️</span>
          <h2>Dino Battles X</h2>
          <p>Hatch a baby dino from a coloured egg, then fight with maths hits in a grassland arena.</p>
        </a>
      </div>
    </main>
  </body>
</html>
